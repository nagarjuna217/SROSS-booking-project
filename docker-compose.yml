services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seating
      POSTGRES_USER: seating
      POSTGRES_PASSWORD: seating
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seating -d seating"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
