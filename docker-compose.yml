x-app-env: &app-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: change-me-for-anything-real
  DJANGO_ALLOWED_HOSTS: "*"
  POSTGRES_DB: seating
  POSTGRES_USER: seating
  POSTGRES_PASSWORD: seating
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  HOLD_DURATION_SECONDS: "120"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seating
      POSTGRES_USER: seating
      POSTGRES_PASSWORD: seating
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seating -d seating"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    environment: *app-env
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Housekeeping only; the API is correct without it (see README).
  expirer:
    build: .
    environment: *app-env
    command: python manage.py expire_holds --every 30
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
